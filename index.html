<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grand Aurora — Hotel (Theme switcher demo)</title>

  <!-- Inline pre-load script to apply theme before styles load (prevents FOUC) -->
  <script>
  (function() {
    const storageKey = 'theme'; // 'light' or 'dark'
    const classLock = 'theme-prevent-transition';
    document.documentElement.classList.add(classLock);

    try {
      const stored = localStorage.getItem(storageKey);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored ? stored : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }

    requestAnimationFrame(() => {
      setTimeout(() => document.documentElement.classList.remove(classLock), 0);
    });
  })();
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="brand">Grand Aurora Hotel</h1>

      <!-- Theme toggle button -->
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" aria-pressed="false" title="Toggle light / dark">
        <!-- Sun icon -->
        <svg id="icon-sun" class="icon icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>

        <!-- Moon icon (hidden by default) -->
        <svg id="icon-moon" class="icon icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
          <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Welcome to Grand Aurora</h2>
      <p>Experience airy luxury by day and cozy sophistication by night.</p>
      <div class="card">Featured suite — warm linens, city view, private balcony</div>
    </section>
  </main>

  <script src="theme.js"></script>
</body>
</html>
