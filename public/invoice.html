<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Inn - Invoice</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Jost', sans-serif; color: #23242c; max-width: 760px; margin: 40px auto; padding: 0 24px; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #c6a15b; padding-bottom: 20px; margin-bottom: 30px; }
        .invoice-header h1 { margin: 0; color: #14161f; }
        .invoice-meta { text-align: right; font-size: 0.9rem; color: #6f7180; }
        .invoice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
        .invoice-block h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6f7180; margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 0.92rem; }
        th { background: #14161f; color: #e0c48a; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .totals { margin-left: auto; width: 280px; }
        .totals div { display: flex; justify-content: space-between; padding: 6px 0; }
        .totals .grand { font-weight: 700; font-size: 1.2rem; border-top: 2px solid #14161f; padding-top: 10px; }
        .print-btn { background: #14161f; color: #fff; border: none; padding: 12px 28px; cursor: pointer; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 30px; }
        @media print { .print-btn { display: none; } body { margin: 0; } }
        #status { color: #6f7180; }
    </style>
</head>
<body>
    <p id="status">Loading invoice&hellip;</p>
    <div id="invoiceContent" style="display: none;">
        <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
        <div class="invoice-header">
            <div style="display: flex; align-items: center; gap: 14px;">
                <img src="images/logo-mark.png" alt="" style="width: 44px; height: auto;">
                <div>
                    <h1 style="margin: 0;">Horizon Inn</h1>
                    <p style="margin: 0;">Boutique Guest House</p>
                </div>
            </div>
            <div class="invoice-meta">
                <div><strong>Invoice #<span id="invId"></span></strong></div>
                <div id="invDate"></div>
                <div>Status: <span id="invStatus"></span></div>
            </div>
        </div>

        <div class="invoice-grid">
            <div class="invoice-block">
                <h3>Billed To</h3>
                <div id="guestName"></div>
                <div id="guestContact"></div>
                <div id="guestCnic"></div>
            </div>
            <div class="invoice-block">
                <h3>Stay Details</h3>
                <div id="stayRoom"></div>
                <div id="stayDates"></div>
                <div id="stayGuests"></div>
            </div>
        </div>

        <table>
            <thead><tr><th>Description</th><th>Nights</th><th>Rate</th><th>Amount</th></tr></thead>
            <tbody id="chargeRow"></tbody>
        </table>

        <h3 style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #6f7180;">Payments Received</h3>
        <table>
            <thead><tr><th>Date</th><th>Method</th><th>Transaction ID</th><th>Amount</th></tr></thead>
            <tbody id="paymentsBody"></tbody>
        </table>

        <div class="totals">
            <div><span>Total Due</span><span id="totalDue"></span></div>
            <div><span>Paid</span><span id="totalPaid"></span></div>
            <div class="grand"><span>Balance</span><span id="totalBalance"></span></div>
        </div>
    </div>

    <script src="invoice.js"></script>
</body>
</html>
